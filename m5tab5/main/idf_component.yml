dependencies:
  idf:
    version: ">=5.4.2"

  # 0017: the feckless libraries, from feckless-libs-for-m5tab5, every
  # one at the same tag. The panel, backlight and gfx text; the I2C bus,
  # IO expanders, touch and USB host; the card and the drive. And three
  # the feckless libraries carry for every Tab5 project now, which were
  # copied here from Duplicitous (Avoidant since): fatfs with exFAT (was
  # cmake/exfat.cmake), usb_host_msc with the Tab5's DMA-sized transfers
  # (was components/usb_host_msc), and usb_host_uac, which the drivers
  # link (was the registry's 1.5.0, here). Pinned to tags.
  feckless_graphics_handler:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_graphics_handler
    version: "v0.3.0"
  feckless_storage_handler:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_storage_handler
    version: "v0.3.0"
  feckless_drivers:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_drivers
    version: "v0.3.0"
  fatfs:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/fatfs
    version: "v0.3.0"
  usb_host_msc:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/usb_host_msc
    version: "v0.3.0"
  usb_host_uac:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/usb_host_uac
    version: "v0.3.0"
