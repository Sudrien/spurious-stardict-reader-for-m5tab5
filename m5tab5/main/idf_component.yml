dependencies:
  idf:
    # u-spurious-0001: 6.1, as feckless-libs' v0.10 (the umode branch's base)
    # requires; the build's picolibc is the ABI's.
    version: ">=6.1"

  # 0017: the feckless libraries, from feckless-libs-for-m5tab5, every
  # one at the same tag. The panel, backlight and gfx text; the I2C bus,
  # IO expanders, touch and USB host; the card and the drive. And three
  # the feckless libraries carry for every Tab5 project now, which were
  # copied here from Duplicitous (Avoidant since): fatfs with exFAT (was
  # cmake/exfat.cmake), usb_host_msc with the Tab5's DMA-sized transfers
  # (was components/usb_host_msc), and usb_host_uac, which the drivers
  # link (was the registry's 1.5.0, here). Pinned to tags.
  # 0018: the feckless ABI and its storage section, at v0.5.0 with the
  # rest -- storage version 2, with fast seek (feckless-libs' 5003). The
  # reader is an ELF built against them (elf/); the .bin links both and
  # runs it, as a launcher does.
  # 0019: v0.8.5, for feckless_keyboard (feckless-libs' 8010): this
  # reader's own keyboard, moved there unchanged so the other Tab5 apps can
  # have it. Linked into the ELF, as tinfl is. Between v0.5.0 and v0.8.5
  # nothing this reader calls changed; the core list gained IDF's GPIO,
  # UART, I2C, partition and OTA names and abort, which feckless_abi now
  # brings the components for itself.
  feckless_abi:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_abi
    version: "umode"
  feckless_abi_storage:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_abi_storage
    version: "umode"
  feckless_graphics_handler:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_graphics_handler
    version: "umode"
  feckless_storage_handler:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_storage_handler
    version: "umode"
  feckless_drivers:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_drivers
    version: "umode"
  fatfs:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/fatfs
    version: "umode"
  usb_host_msc:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/usb_host_msc
    version: "umode"
  usb_host_uac:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/usb_host_uac
    version: "umode"
  feckless_keyboard:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_keyboard
    version: "umode"
  # 0024: v0.8.7, for feckless_libversions (feckless-libs' 8012-8014): the
  # settings panel's list of libraries, generated when elf/ is configured.
  # A header only. v0.8.7 also has 8015, Ark12 with IPA, which the
  # pronunciations need.
  feckless_libversions:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_libversions
    version: "umode"

  # u-spurious-0001: a box. Every feckless pin above is feckless-libs' umode
  # branch, not a tag, while it is tested; the lock records its commit.
  # feckless_box_libc goes into the ELF (feckless_abi_box_elf()); the box
  # itself, feckless_umode and feckless_box_calls, into standalone.c's .bin.
  feckless_box_libc:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_box_libc
    version: "umode"
  feckless_umode:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_umode
    version: "umode"
  feckless_box_calls:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_box_calls
    version: "umode"
